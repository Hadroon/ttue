<app-header></app-header>

<main id="main" role="main">
  <section class="reset-section">
    <div class="card">
      <div class="card-accent"></div>
      <h1>Choose a new password</h1>

      @if (!token()) {
        <p class="error" role="alert">This reset link is incomplete. Please open the link from your email again, or request a new one from the sign-in window.</p>
        <a routerLink="/" class="btn secondary">Back to home</a>
      } @else {
        <form (ngSubmit)="onSubmit()">
          <label>
            <span>New password</span>
            <div class="password-row">
              <input name="password" [type]="showPassword() ? 'text' : 'password'" [(ngModel)]="password" autocomplete="new-password"
                     required minlength="8" maxlength="72" aria-describedby="password-help">
              <button type="button" class="toggle" (click)="showPassword.set(!showPassword())"
                      [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'" [attr.aria-pressed]="showPassword()">
                {{ showPassword() ? 'Hide' : 'Show' }}
              </button>
            </div>
            <small id="password-help">At least 8 characters. A few random words make a strong, memorable password. Don't reuse one from another site.</small>
          </label>
          @if (error()) {
            <p class="error" role="alert">{{ error() }}</p>
          }
          <button type="submit" class="btn primary" [disabled]="busy() || password.length < 8">
            {{ busy() ? 'Saving...' : 'Save password and sign in' }}
          </button>
          <p class="note">This signs you out on all other devices.</p>
        </form>
      }
    </div>
  </section>
</main>

<app-footer />
