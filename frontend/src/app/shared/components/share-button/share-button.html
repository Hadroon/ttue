<div class="share-wrapper">
  <button
    type="button"
    class="share-trigger"
    [class.with-label]="!!label()"
    (click)="toggle($event)"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="menu"
    [attr.aria-label]="ariaLabel()"
    [title]="ariaLabel()">
    <svg class="share-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="18" cy="5" r="3" />
      <circle cx="6" cy="12" r="3" />
      <circle cx="18" cy="19" r="3" />
      <line x1="8.6" y1="13.5" x2="15.4" y2="17.5" />
      <line x1="15.4" y1="6.5" x2="8.6" y2="10.5" />
    </svg>
    @if (label()) {
      <span class="share-label">{{ label() }}</span>
    }
  </button>

  @if (isOpen()) {
    <div class="share-dropdown" role="menu">
      <button type="button" class="share-item" role="menuitem" (click)="copyLink($event)">
        {{ copied() ? '✓ Link copied' : 'Copy link' }}
      </button>
      @if (canNativeShare()) {
        <button type="button" class="share-item" role="menuitem" (click)="nativeShare($event)">
          Share via device…
        </button>
      }
      <div class="share-divider" role="separator"></div>
      @for (target of targets(); track target.id) {
        <a class="share-item" role="menuitem" [href]="target.href" target="_blank" rel="noopener noreferrer"
          (click)="closeMenu()">
          {{ target.label }}
        </a>
      }
    </div>
  }
</div>
